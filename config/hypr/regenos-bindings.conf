# REGENOS shortcuts. SUPER is the Windows key on most laptop keyboards.
bind = SUPER, SPACE, exec, wofi --show drun
bind = SUPER, RETURN, exec, kitty
bind = SUPER, E, exec, thunar
bind = SUPER, A, exec, xdg-open http://127.0.0.1:8765
bind = SUPER SHIFT, A, exec, systemctl --user start ai-os-avatar.service
bind = SUPER, R, exec, systemctl --user start ai-os.service
bind = SUPER SHIFT, R, exec, systemctl --user restart ai-os.service
bind = SUPER CTRL, R, exec, systemctl --user stop ai-os.service
bind = SUPER, L, exec, hyprlock
bind = SUPER SHIFT, Q, killactive
bind = SUPER, V, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = SUPER, UP, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = SUPER, DOWN, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = SUPER SHIFT, UP, exec, brightnessctl set +5%
bindel = SUPER SHIFT, DOWN, exec, brightnessctl set 5%-
