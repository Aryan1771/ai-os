[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-os-interface-layer"
version = "0.1.0"
description = "Offline-first AI-OS interface layer for Arch Linux"
requires-python = ">=3.12"
dependencies = [
  "psutil>=5.9.8",
  "requests>=2.32.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
# 6.12.0 crashes at native teardown in controlled CI; revisit with full-process evidence.
# Keep Essentials/Addons bounds paired. See docs/CI_VALIDATION.md.
desktop = ["PySide6-Essentials>=6.8,<6.12"]
screen = ["PySide6-Addons>=6.8,<6.12"]
memory = ["chromadb>=0.5.0"]
voice = ["openwakeword>=0.6.0", "piper-tts>=1.2.0"]
speaker = ["sherpa-onnx>=1.12,<2"]
vision = ["opencv-python>=4.9.0"]
udev = ["pyudev>=0.24.0"]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[tool.setuptools]
packages = ["ai_os", "ai_os.tools", "ai_os.security", "ai_os.services"]

[project.gui-scripts]
regenos-settings = "ai_os.hub_launcher:main"
regenos-companion = "ai_os.avatar_overlay:main"
regenos-chat = "ai_os.quick_chat:main"
regenos-research = "ai_os.research_widget:main"
regenos-setup = "ai_os.first_run:main"

[tool.ruff]
line-length = 100
target-version = "py312"
