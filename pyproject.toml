[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-os-interface-layer"
version = "0.1.0"
description = "Offline-first AI-OS interface layer for Arch Linux"
requires-python = ">=3.12"
dependencies = [
  "psutil>=5.9.8",
  "requests>=2.32.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
memory = ["chromadb>=0.5.0"]
voice = ["openwakeword>=0.6.0", "piper-tts>=1.2.0"]
vision = ["opencv-python>=4.9.0"]
udev = ["pyudev>=0.24.0"]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[tool.setuptools]
packages = ["ai_os", "ai_os.tools", "ai_os.security", "ai_os.services"]

[tool.ruff]
line-length = 100
target-version = "py312"

